<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sprint Circuit &mdash; 2D Top-View Racer</title>
<!-- ?v= is a cache buster. GitHub Pages serves these files with a 10 minute
     max-age, so without it a browser keeps running the previous build after a
     deploy. Bump the number on every push that changes css/ or js/. -->
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="1000" height="620"></canvas>
    <div id="hint">
      <span><b>&#8592;</b> <b>&#8594;</b> steer</span>
      <span><b>SPACE</b> accelerate</span>
      <span><b>&#8595;</b> brake / reverse</span>
      <span><b>P</b> pause</span>
      <span><b>R</b> restart</span>
    </div>
  </div>

  <script src="js/util.js?v=2"></script>
  <script src="js/track.js?v=2"></script>
  <script src="js/input.js?v=2"></script>
  <script src="js/car.js?v=2"></script>
  <script src="js/ai.js?v=2"></script>
  <script src="js/render.js?v=2"></script>
  <script src="js/game.js?v=2"></script>
</body>
</html>
